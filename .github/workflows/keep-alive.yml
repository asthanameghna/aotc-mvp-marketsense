name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MarketSense API
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://marketsense-v3-verified.onrender.com
