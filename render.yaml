services:
  # The main web service hosting the API, the Frontend, AND the background jobs
  - type: web
    name: marketsense
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NEWS_INTERVAL_MINUTES
        value: "5"
      - key: MARKET_DATA_INTERVAL_MINUTES
        value: "15"
